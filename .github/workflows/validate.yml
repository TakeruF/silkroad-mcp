name: Validate hub

on:
  # No path filter: Markdown here is validated (generated README, link and
  # secret checks), so docs changes need this workflow too.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:media
      - run: npm run check:generated
