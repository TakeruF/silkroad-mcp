name: Deploy catalog site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:media
      - run: npm run build
        env:
          SITE_BASE: /silkroad-mcp
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
